<!DOCTYPE html>
<!--
  Web Development :: Graded Assignment (Weeks 1-6)
  Question 2  -  Student ID Card Application Form
  Prepared by : AMMAN JAKHAR
  UID         : 2025eb01187
  Each input runs its checker on the onfocusout event; submit builds an
  Applicant object, logs it, and parks it in a cookie. A second panel then
  reads that cookie back by mobile number.
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2025eb01187</title>

  <style>
    body {
      margin: 0;
      padding: 36px 14px;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: #13343b;
      background: #eef3f2;
      display: flex;
      justify-content: center;
    }

    .panel {
      width: 430px;
      max-width: 100%;
      padding: 26px 28px 30px;
      background: #fff;
      border-top: 6px solid #e0a800;
      border-radius: 6px;
      box-shadow: 0 8px 22px rgba(19, 52, 59, 0.18);
    }

    .panel__title {
      margin: 0 0 4px;
      font-size: 21px;
    }

    .panel__hint {
      margin: 0 0 10px;
      font-size: 12px;
      color: #5c7177;
    }

    .field {
      border: 0;
      margin: 16px 0 0;
      padding: 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    input {
      width: 100%;
      padding: 10px 11px;
      font-size: 14px;
      color: #13343b;
      background: #fbfdfc;
      border: 1px solid #c3cdcb;
      border-radius: 4px;
      box-sizing: border-box;
    }

    input:focus {
      outline: 2px solid #e0a800;
      border-color: #e0a800;
    }

    input[readonly] {
      background: #eef1f0;
      color: #566;
    }

    .msg {
      display: block;
      min-height: 16px;
      margin-top: 4px;
      font-size: 12px;
      color: #b3261e;
    }

    .go {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #fff;
      background: #13343b;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    .go:hover {
      background: #0c252b;
    }
  </style>
</head>

<body>

  <!-- ===== Panel 1 : the application form ===== -->
  <section id="formPage" class="panel">
    <h1 class="panel__title">Student ID Card Application</h1>
    <p class="panel__hint">Fields are checked as you leave each box.</p>

    <form id="appForm" onsubmit="return onSubmit(event)" novalidate>

      <fieldset class="field">
        <label for="name">Full Name</label>
        <input id="name" type="text" autocomplete="off" onfocusout="checkName()" />
        <small id="nameError" class="msg"></small>
      </fieldset>

      <fieldset class="field">
        <label for="dob">Date of Birth <span style="font-weight:400">(dd/mm/yyyy)</span></label>
        <input id="dob" type="text" autocomplete="off" placeholder="dd/mm/yyyy" onfocusout="checkDob()" />
        <small id="dobError" class="msg"></small>
      </fieldset>

      <fieldset class="field">
        <label for="age">Age</label>
        <input id="age" type="text" readonly placeholder="filled from DOB" />
        <small id="ageError" class="msg"></small>
      </fieldset>

      <fieldset class="field">
        <label for="mobile">Mobile Number</label>
        <input id="mobile" type="text" autocomplete="off" onfocusout="checkMobile()" />
        <small id="mobileError" class="msg"></small>
      </fieldset>

      <fieldset class="field">
        <label for="email">Email ID</label>
        <input id="email" type="text" autocomplete="off" onfocusout="checkEmail()" />
        <small id="emailError" class="msg"></small>
      </fieldset>

      <button type="submit" class="go">Submit Application</button>
    </form>
  </section>

  <!-- ===== Panel 2 : read the saved cookie back ===== -->
  <section id="retrievePage" class="panel" style="display:none">
    <h1 class="panel__title">Retrieve Saved Details</h1>
    <p class="panel__hint">Type the mobile number you submitted.</p>

    <fieldset class="field">
      <label for="retrieveMobile">Mobile Number</label>
      <input id="retrieveMobile" type="text" autocomplete="off" />
    </fieldset>

    <button type="button" class="go" onclick="onRetrieve()">Retrieve Cookie</button>
  </section>

  <script src="StudentApp.js"></script>
</body>

</html>
