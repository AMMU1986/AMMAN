<!DOCTYPE html>
<!--
=====================================================================
  Graded Assignment (Weeks 1-6) - Question 2
  Student ID Card Application Form
  Student ID: STU2024001          <-- replace with your real Student ID
=====================================================================
-->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title set to the Student ID so it is visible in screenshots -->
    <title>STU2024001</title>

    <!-- Minimal inline styling just to make the form readable -->
    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: #fff;
            width: 420px;
            max-width: 100%;
            padding: 25px 30px;
            border: 2px solid #1a3c6e;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #1a3c6e;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 9px 10px;
            margin-top: 5px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[readonly] {
            background: #f0f0f0;
        }

        .error {
            color: #c0392b;
            font-size: 12px;
            min-height: 15px;
            display: block;
            margin-top: 3px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            background: #1a3c6e;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #16325c;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <!-- =============================================================
         PAGE 1 : Student application form
    ============================================================== -->
    <div class="card" id="formPage">
        <h2>Student ID Card Application</h2>

        <form id="studentForm" onsubmit="return submitForm(event)">

            <!-- Name field -->
            <label for="name">Name</label>
            <input type="text" id="name" name="name"
                   onfocusout="validateName()" placeholder="Enter full name" />
            <span class="error" id="nameError"></span>

            <!-- Date of birth field -->
            <label for="dob">Date of Birth (dd/mm/yyyy)</label>
            <input type="text" id="dob" name="dob"
                   onfocusout="validateDob()" placeholder="dd/mm/yyyy" />
            <span class="error" id="dobError"></span>

            <!-- Age field (read-only, auto-calculated) -->
            <label for="age">Age</label>
            <input type="text" id="age" name="age" readonly placeholder="Auto-calculated" />
            <span class="error" id="ageError"></span>

            <!-- Mobile number field -->
            <label for="mobile">Mobile Number</label>
            <input type="text" id="mobile" name="mobile"
                   onfocusout="validateMobile()" placeholder="Enter mobile number" />
            <span class="error" id="mobileError"></span>

            <!-- Email ID field -->
            <label for="email">Email ID</label>
            <input type="text" id="email" name="email"
                   onfocusout="validateEmail()" placeholder="name@example.com" />
            <span class="error" id="emailError"></span>

            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- =============================================================
         PAGE 2 : Retrieve details from the cookie
         (shown only after a successful submission)
    ============================================================== -->
    <div class="card hidden" id="retrievePage">
        <h2>Retrieve Student Details</h2>

        <label for="retrieveMobile">Mobile Number</label>
        <input type="text" id="retrieveMobile" placeholder="Enter mobile number" />

        <button type="button" onclick="retrieveCookie()">Retrieve Cookie</button>
    </div>

    <!-- Link the external JavaScript file -->
    <script src="StudentApp.js"></script>
</body>

</html>
