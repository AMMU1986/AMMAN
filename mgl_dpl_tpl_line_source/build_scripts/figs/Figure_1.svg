<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<text x="230" y="30" font-size="15" font-weight="bold" text-anchor="middle">(a) Pulsed line source (axisymmetric)</text>
<rect x="20" y="50" width="420" height="420" fill="#eef2f7" stroke="#555"/>
<circle cx="230" cy="270" r="170" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7,5"/>
<circle cx="230" cy="270" r="110" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,4"/>
<circle cx="230" cy="270" r="7" fill="#1f4e9c"/>
<text x="30" y="420" font-size="13">line source, Q(r,t)=Q<tspan baseline-shift="-25%" font-size="75%">0</tspan>δ(r)f(t)/(2πr)</text>
<line x1="230" y1="270" x2="430" y2="270" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="425" y="262" font-size="15" font-style="italic">r</text>
<text x="230" y="92" font-size="13" fill="#c0392b" text-anchor="middle">thermal wavefront r = c<tspan baseline-shift="-25%" font-size="75%">w</tspan>t</text>
<text x="230" y="455" font-size="13" text-anchor="middle">diffusive/strain-rate tail (infinite speed, exponentially small)</text>
<text x="230" y="70" font-size="13" text-anchor="middle">z axis out of plane: plane strain, u = u(r,t)</text>
<text x="700" y="30" font-size="15" font-weight="bold" text-anchor="middle">(b) Source translating at speed V</text>
<rect x="480" y="50" width="420" height="420" fill="#eef2f7" stroke="#555"/>
<circle cx="650" cy="270" r="90" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7,5"/>
<circle cx="650" cy="270" r="6" fill="#1f4e9c" fill-opacity="0.4"/>
<circle cx="780" cy="270" r="7" fill="#1f4e9c"/>
<line x1="656" y1="270" x2="770" y2="270" stroke="#1f4e9c" stroke-width="2" marker-end="url(#ar)"/>
<text x="740" y="296" font-size="13">source at x = Vt</text>
<text x="650" y="380" font-size="13" text-anchor="middle">x = 0 at t = 0</text>
<line x1="780" y1="270" x2="590" y2="150" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="780" y1="270" x2="590" y2="390" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="500" y="95" font-size="13" fill="#c0392b">Mach cone, sin β = c<tspan baseline-shift="-25%" font-size="75%">w</tspan>/V (V &gt; c<tspan baseline-shift="-25%" font-size="75%">w</tspan>)</text>
<line x1="500" y1="445" x2="600" y2="445" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="606" y="450" font-size="14" font-style="italic">x</text>
<line x1="500" y1="445" x2="500" y2="355" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="508" y="362" font-size="14" font-style="italic">y</text></svg>