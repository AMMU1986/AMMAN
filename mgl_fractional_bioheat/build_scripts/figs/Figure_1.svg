<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<text x="450" y="22" font-size="15" font-weight="bold" text-anchor="middle">(a) Layered slab: tumour 0 &lt; x &lt; h, normal tissue h &lt; x &lt; L</text>
<rect x="80" y="60" width="150" height="120" fill="#e8c9c9" stroke="#444" stroke-width="1.5"/>
<rect x="230" y="60" width="590" height="120" fill="#d6e4f0" stroke="#444" stroke-width="1.5"/>
<text x="155" y="112" font-size="14" text-anchor="middle">tumour (1)</text>
<text x="155" y="134" font-size="14" text-anchor="middle">w<tspan baseline-shift="-25%" font-size="75%">b1</tspan>(θ), k<tspan baseline-shift="-25%" font-size="75%">1</tspan>(θ)</text>
<text x="525" y="112" font-size="14" text-anchor="middle">normal tissue (2)</text>
<text x="525" y="134" font-size="14" text-anchor="middle">w<tspan baseline-shift="-25%" font-size="75%">b2</tspan>(θ), k<tspan baseline-shift="-25%" font-size="75%">2</tspan></text>
<line x1="230" y1="52" x2="230" y2="190" stroke="#222" stroke-dasharray="4,3"/>
<text x="230" y="208" font-size="14" text-anchor="middle">x = h (interface)</text>
<text x="80" y="208" font-size="14" text-anchor="middle">x = 0</text>
<text x="820" y="208" font-size="14" text-anchor="middle">x = L</text>
<text x="10" y="100" font-size="12" >θ=θ<tspan baseline-shift="-25%" font-size="75%">0</tspan>H(t)</text>
<text x="10" y="120" font-size="14" >σ = 0</text>
<text x="826" y="100" font-size="14" >u = 0</text>
<text x="826" y="120" font-size="14" >θ = 0</text>
<line x1="130" y1="46" x2="130" y2="58" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="142" y="36" font-size="14" fill="#c0392b">laser I<tspan baseline-shift="-25%" font-size="75%">0</tspan>f(t)</text>
<text x="450" y="252" font-size="15" font-weight="bold" text-anchor="middle">(b) Finite element mesh: nodes at the interface, linear elements</text>
