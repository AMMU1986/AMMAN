<text x="260" y="328" font-size="14" >dofs per node: u, θ ;  banded matrix, half bandwidth 3</text>
<text x="450" y="372" font-size="15" font-weight="bold" text-anchor="middle">(c) Solution procedure for each time step t<tspan baseline-shift="-25%" font-size="75%">n</tspan></text>
<rect x="40" y="392" width="140" height="64" rx="6" fill="#f3f3f3" stroke="#444"/>
<text x="110" y="418" font-size="14" text-anchor="middle" font-weight="bold">history sums</text>
<text x="110" y="440" font-size="12" text-anchor="middle">Σ c<tspan baseline-shift="-25%" font-size="75%">j</tspan>z<tspan baseline-shift="-25%" font-size="75%">n-j</tspan>, j &gt; 0</text>
<line x1="180" y1="424" x2="208" y2="424" stroke="#222" marker-end="url(#ar)"/>
<rect x="208" y="392" width="140" height="64" rx="6" fill="#f3f3f3" stroke="#444"/>
<text x="278" y="418" font-size="14" text-anchor="middle" font-weight="bold">assemble</text>
<text x="278" y="440" font-size="12" text-anchor="middle">K(θ<tspan baseline-shift="40%" font-size="75%">k</tspan>), ω(θ<tspan baseline-shift="40%" font-size="75%">k</tspan>)</text>
<line x1="348" y1="424" x2="376" y2="424" stroke="#222" marker-end="url(#ar)"/>
<rect x="376" y="392" width="140" height="64" rx="6" fill="#f3f3f3" stroke="#444"/>
<text x="446" y="418" font-size="14" text-anchor="middle" font-weight="bold">banded LU</text>
<text x="446" y="440" font-size="12" text-anchor="middle">solve u<tspan baseline-shift="40%" font-size="75%">k+1</tspan>, θ<tspan baseline-shift="40%" font-size="75%">k+1</tspan></text>
<line x1="516" y1="424" x2="544" y2="424" stroke="#222" marker-end="url(#ar)"/>
<rect x="544" y="392" width="140" height="64" rx="6" fill="#f3f3f3" stroke="#444"/>
<text x="614" y="418" font-size="14" text-anchor="middle" font-weight="bold">Picard test</text>
<text x="614" y="440" font-size="12" text-anchor="middle">max|Δθ| &lt; 10<tspan baseline-shift="40%" font-size="75%">-11</tspan>?</text>
<line x1="684" y1="424" x2="712" y2="424" stroke="#222" marker-end="url(#ar)"/>
<rect x="712" y="392" width="140" height="64" rx="6" fill="#f3f3f3" stroke="#444"/>
<text x="782" y="418" font-size="14" text-anchor="middle" font-weight="bold">post-process</text>
<text x="782" y="440" font-size="12" text-anchor="middle">σ, flux, metrics</text>
<path d="M 544 456 L 544 480 L 296 480 L 296 458" fill="none" stroke="#222" marker-end="url(#ar)"/>
<text x="420" y="498" font-size="12" text-anchor="middle">not converged: next Picard iteration</text>
<text x="450" y="540" font-size="13" text-anchor="middle" font-style="italic">Schematic only: contains no computed data.</text></svg>