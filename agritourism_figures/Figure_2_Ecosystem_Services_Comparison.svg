<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <style>
      .title { font: bold 18px 'Segoe UI', Arial, sans-serif; fill: #1a1a1a; }
      .axis-label { font: 12px 'Segoe UI', Arial, sans-serif; fill: #333; }
      .legend { font: 13px 'Segoe UI', Arial, sans-serif; fill: #333; }
      .note { font: italic 11px 'Segoe UI', Arial, sans-serif; fill: #666; }
      .scale { font: 10px 'Segoe UI', Arial, sans-serif; fill: #999; }
    </style>
  </defs>
  <rect width="900" height="650" fill="#fafbfc" rx="8"/>
  <text x="450" y="35" text-anchor="middle" class="title">Figure 2. Ecosystem Services Comparison: Conventional vs. Regenerative</text>
  <text x="450" y="58" text-anchor="middle" class="title">Agri-Tourism Landscapes (Scale: 0–10)</text>
  <!-- Grid -->
  <polygon points="450.0,304.0 475.5,314.5 486.0,340.0 475.5,365.5 450.0,376.0 424.5,365.5 414.0,340.0 424.5,314.5" fill="none" stroke="#ddd" stroke-width="1"/>
  <polygon points="450.0,268.0 500.9,289.1 522.0,340.0 500.9,390.9 450.0,412.0 399.1,390.9 378.0,340.0 399.1,289.1" fill="none" stroke="#ddd" stroke-width="1"/>
  <polygon points="450.0,232.0 526.4,263.6 558.0,340.0 526.4,416.4 450.0,448.0 373.6,416.4 342.0,340.0 373.6,263.6" fill="none" stroke="#ddd" stroke-width="1"/>
  <polygon points="450.0,196.0 551.8,238.2 594.0,340.0 551.8,441.8 450.0,484.0 348.2,441.8 306.0,340.0 348.2,238.2" fill="none" stroke="#ddd" stroke-width="1"/>
  <polygon points="450.0,160.0 577.3,212.7 630.0,340.0 577.3,467.3 450.0,520.0 322.7,467.3 270.0,340.0 322.7,212.7" fill="none" stroke="#ddd" stroke-width="1"/>

  <!-- Axes -->
  <line x1="450" y1="340" x2="450.0" y2="160.0" stroke="#ccc" stroke-width="1"/>
  <line x1="450" y1="340" x2="577.3" y2="212.7" stroke="#ccc" stroke-width="1"/>
  <line x1="450" y1="340" x2="630.0" y2="340.0" stroke="#ccc" stroke-width="1"/>
  <line x1="450" y1="340" x2="577.3" y2="467.3" stroke="#ccc" stroke-width="1"/>
  <line x1="450" y1="340" x2="450.0" y2="520.0" stroke="#ccc" stroke-width="1"/>
  <line x1="450" y1="340" x2="322.7" y2="467.3" stroke="#ccc" stroke-width="1"/>
  <line x1="450" y1="340" x2="270.0" y2="340.0" stroke="#ccc" stroke-width="1"/>
  <line x1="450" y1="340" x2="322.7" y2="212.7" stroke="#ccc" stroke-width="1"/>

  <!-- Scale labels -->
  <text x="455" y="304.0" class="scale">2</text>
  <text x="455" y="268.0" class="scale">4</text>
  <text x="455" y="232.0" class="scale">6</text>
  <text x="455" y="196.0" class="scale">8</text>
  <text x="455" y="160.0" class="scale">10</text>
  <!-- Conventional polygon -->
  <polygon points="450.0,304.0 488.2,301.8 504.0,340.0 488.2,378.2 450.0,394.0 424.5,365.5 414.0,340.0 348.2,238.2" fill="#e74c3c" fill-opacity="0.15" stroke="#e74c3c" stroke-width="2.5"/>
  <!-- Regenerative polygon -->
  <polygon points="450.0,196.0 551.8,238.2 594.0,340.0 539.1,429.1 450.0,502.0 348.2,441.8 324.0,340.0 360.9,250.9" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="2.5"/>
  <!-- Labels -->
  <text x="450.0" y="125.0" text-anchor="middle" class="axis-label">Carbon Sequestration</text>
  <text x="602.0" y="188.0" text-anchor="start" class="axis-label">Biodiversity</text>
  <text x="665.0" y="340.0" text-anchor="start" class="axis-label">Water Retention</text>
  <text x="602.0" y="492.0" text-anchor="start" class="axis-label">Pollination</text>
  <text x="450.0" y="555.0" text-anchor="middle" class="axis-label">Soil Health</text>
  <text x="298.0" y="492.0" text-anchor="end" class="axis-label">Aesthetic Value</text>
  <text x="235.0" y="340.0" text-anchor="end" class="axis-label">Cultural Services</text>
  <text x="298.0" y="188.0" text-anchor="end" class="axis-label">Food Production</text>

  <!-- Legend -->
  <rect x="320" y="575" width="20" height="14" fill="#e74c3c" fill-opacity="0.4" stroke="#e74c3c" stroke-width="1.5" rx="2"/>
  <text x="348" y="587" class="legend">Conventional Agriculture</text>
  <rect x="530" y="575" width="20" height="14" fill="#27ae60" fill-opacity="0.4" stroke="#27ae60" stroke-width="1.5" rx="2"/>
  <text x="558" y="587" class="legend">Regenerative Agri-Tourism</text>
  <!-- Source -->
  <text x="450" y="635" text-anchor="middle" class="note">Source: Adapted from Lal (2020), Kremen and Merenlender (2018), and field data compilation</text>
