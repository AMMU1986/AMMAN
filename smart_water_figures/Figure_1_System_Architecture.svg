<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0b3d5c">Layered Architecture of a Next-Generation Smart Water System</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#5a6b77">Four tiers from physical assets to decision support, with cross-cutting security and governance</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7b86"/>
    </marker>
  </defs>

  <!-- tiers -->
  <g>
    <rect x="120" y="80" width="560" height="70" rx="10" fill="#e8f1f8" stroke="#1f7a9c" stroke-width="2"/>
    <text x="400" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#134e68">4. Decision Support &amp; Control</text>
    <text x="400" y="132" text-anchor="middle" font-size="11.5" fill="#3a5563">demand forecasting · leak localization · adaptive distribution · digital twin</text>
  </g>
  <g>
    <rect x="120" y="170" width="560" height="70" rx="10" fill="#eaf5ec" stroke="#2e8b57" stroke-width="2"/>
    <text x="400" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#1e5e3a">3. Analytics &amp; Edge–Cloud Computing</text>
    <text x="400" y="222" text-anchor="middle" font-size="11.5" fill="#3a5563">anomaly detection · predictive maintenance · data assimilation</text>
  </g>
  <g>
    <rect x="120" y="260" width="560" height="70" rx="10" fill="#f3eaf6" stroke="#7a4f9c" stroke-width="2"/>
    <text x="400" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#4e2e68">2. Connectivity &amp; Interoperability</text>
    <text x="400" y="312" text-anchor="middle" font-size="11.5" fill="#3a5563">low-power WAN · open data models · common communication standards</text>
  </g>
  <g>
    <rect x="120" y="350" width="560" height="70" rx="10" fill="#fdf2e3" stroke="#d98b25" stroke-width="2"/>
    <text x="400" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#99611a">1. Sensing &amp; Physical Assets</text>
    <text x="400" y="402" text-anchor="middle" font-size="11.5" fill="#3a5563">smart meters · pressure/flow · water-quality probes · pumps &amp; valves</text>
  </g>

  <!-- bidirectional data/control flow -->
  <g stroke="#6b7b86" stroke-width="2.4" fill="none" marker-start="url(#ar)" marker-end="url(#ar)">
    <line x1="400" y1="150" x2="400" y2="170"/>
    <line x1="400" y1="240" x2="400" y2="260"/>
    <line x1="400" y1="330" x2="400" y2="350"/>
  </g>
  <text x="705" y="200" font-size="11" fill="#5a6b77">data up ↑</text>
  <text x="705" y="300" font-size="11" fill="#5a6b77">control down ↓</text>

  <!-- cross-cutting band -->
  <rect x="710" y="80" width="80" height="340" rx="10" fill="#0b3d5c"/>
  <text x="750" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" transform="rotate(90 750 250)">Cybersecurity · Data Governance</text>

  <text x="400" y="460" text-anchor="middle" font-size="12" fill="#3a5563">Each tier depends on the one below; security and governance span all four.</text>
  <text x="400" y="500" text-anchor="middle" font-size="11.5" fill="#5a6b77">Scalability, energy efficiency, and resilience are system-wide properties rather than features of any single tier.</text>
</svg>
