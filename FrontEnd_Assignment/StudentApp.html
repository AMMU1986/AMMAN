<!DOCTYPE html>                                   <!-- standards-mode HTML5 -->
<!--
=====================================================================
  QUESTION 2 - STUDENT ID CARD APPLICATION (the form page)
  -----------------------------------------------------------------
  Author : AMMAN JAKHAR  |  UID : 2025EB01187  |  DOB : 29.08.1986
  -----------------------------------------------------------------
  This page is just the "shape" of the form. The marks for Q2 are in
  the JavaScript, so I deliberately kept the styling short and inline
  and moved ALL the behaviour (validation, the Student object, and
  the cookie) into StudentApp.js. Each input has:
      - a <label> (good for accessibility and for clicking),
      - an id the JS can grab,
      - an empty .error <div> the JS fills in if something is wrong.
=====================================================================
-->
<html lang="en">

<head>
    <meta charset="UTF-8">                        <!-- UTF-8 so names/symbols survive -->
    <!-- responsive on phones; without this the form looks shrunk on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Q2 rule again: the tab caption must be my UID -->
    <title>2025EB01187</title>

    <!-- CSS is inline on purpose: it is small and the JS file is the real deliverable -->
    <style>
        * { box-sizing: border-box; }            /* count padding+border inside every width */

        body {                                    /* the page behind the form */
            font-family: "Segoe UI", Tahoma, Arial, sans-serif; /* readable sans-serif ladder */
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); /* same blue wash as Q1, for consistency */
            margin: 0;
            padding: 30px;                        /* keep the card off the window edges */
            display: flex;                        /* flexbox just to... */
            justify-content: center;              /* ...centre the form horizontally */
        }

        .form-card {                              /* the white sheet the form sits on */
            background: #ffffff;
            width: 440px;                         /* narrow enough to read in one eye-line */
            padding: 28px 32px;
            border-radius: 14px;                  /* rounded, matching the Q1 card */
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2); /* float it above the page */
        }

        h1 {                                      /* the form's title */
            font-size: 22px;
            color: #1e3c72;                       /* brand dark-blue */
            margin: 0 0 4px 0;
            text-align: center;
        }

        .subtitle {                               /* one grey helper line under the title */
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 22px;                  /* space before the first field */
        }

        .field { margin-bottom: 16px; }          /* consistent gap between each field group */

        label {                                   /* the caption above each input */
            display: block;                       /* force it onto its own line */
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        input, select {                           /* one shared style for every control */
            width: 100%;                          /* fill the card's width */
            padding: 10px 12px;                   /* comfortable to tap/type in */
            font-size: 14px;
            border: 1px solid #ccc;               /* calm grey border at rest */
            border-radius: 7px;
            outline: none;                        /* I replace the default focus ring with my own colour */
            transition: border-color 0.2s;        /* animate the border when focus changes */
        }

        input:focus, select:focus { border-color: #2a5298; } /* blue edge tells you where the cursor is */

        /* the JS adds .invalid to any control that fails its check */
        input.invalid, select.invalid { border-color: #e74c3c; background: #fdf0ef; } /* red edge + pink tint = "fix me" */

        .error {                                  /* the little message that appears under a bad field */
            color: #e74c3c;                       /* red = problem */
            font-size: 12px;
            min-height: 15px;                     /* reserve the row even when empty, so nothing jumps around */
            margin-top: 4px;
        }

        button {                                  /* the submit button */
            width: 100%;
            padding: 12px;                        /* big tap target */
            margin-top: 6px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* the brand gradient again */
            border: none;
            border-radius: 8px;
            cursor: pointer;                      /* show a hand so it reads as clickable */
        }

        button:hover { opacity: 0.92; }          /* a tiny dim on hover = "I'm interactive" */

        .result {                                 /* the green summary banner the JS reveals on success */
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            background: #eafaf1;                  /* pale green = success */
            border: 1px solid #27ae60;
            color: #1e7e44;
            font-size: 13px;
            display: none;                        /* hidden by default; JS flips this to block */
            white-space: pre-line;                /* so the "\n" line breaks I add in JS are honoured */
        }
    </style>
</head>

<body>

    <div class="form-card">                       <!-- the white panel -->
        <h1>Student ID Card Application</h1>      <!-- title -->
        <p class="subtitle">Please fill in all the fields below</p> <!-- instruction -->

        <!-- novalidate = switch OFF the browser's own popups so MY JavaScript is the only validator -->
        <form id="studentForm" novalidate>

            <!-- Field 1: Full Name -->
            <div class="field">
                <label for="fullName">Full Name</label>                 <!-- "for" links the label to the input id -->
                <input type="text" id="fullName" placeholder="e.g. Amman Jakhar"> <!-- placeholder shows an example -->
                <div class="error" id="err-fullName"></div>             <!-- JS writes the error here, keyed by id -->
            </div>

            <!-- Field 2: University ID -->
            <div class="field">
                <label for="uid">University ID (UID)</label>
                <input type="text" id="uid" placeholder="e.g. 2025EB01187">
                <div class="error" id="err-uid"></div>
            </div>

            <!-- Field 3: Email -->
            <div class="field">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="e.g. name@example.com">
                <div class="error" id="err-email"></div>
            </div>

            <!-- Field 4: Phone -->
            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="10 digit mobile number">
                <div class="error" id="err-phone"></div>
            </div>

            <!-- Field 5: Date of Birth (type=date gives a free calendar picker) -->
            <div class="field">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">
                <div class="error" id="err-dob"></div>
            </div>

            <!-- Extra field: Course. It is a dropdown, and it is NOT one of the five graded validations. -->
            <div class="field">
                <label for="course">Course</label>
                <select id="course">
                    <option value="">-- Select a course --</option>     <!-- empty value = "nothing chosen yet" -->
                    <option value="M.Sc. Computer Science">M.Sc. Computer Science</option>
                    <option value="B.Tech. Mechanical">B.Tech. Mechanical</option>
                    <option value="MBA">MBA</option>
                </select>
                <div class="error" id="err-course"></div>
            </div>

            <button type="submit">Generate ID Card</button>             <!-- type=submit is what fires the form's submit event -->
        </form>

        <!-- stays empty + hidden until a clean submission fills it in -->
        <div class="result" id="result"></div>
    </div>

    <!-- the graded logic lives in this one external file -->
    <script src="StudentApp.js"></script>
</body>
</html>
