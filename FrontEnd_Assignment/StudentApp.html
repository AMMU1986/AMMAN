<!DOCTYPE html>                                   <!-- Mark the file as HTML5 -->
<!--
=====================================================================
  QUESTION 2  |  STUDENT ID CARD APPLICATION (FORM PAGE)
  -----------------------------------------------------------------
  Student Name : AMMAN JAKHAR
  Student UID  : 2025EB01187
  Date of Birth: 29.08.1986
  -----------------------------------------------------------------
  File         : StudentApp.html
  Purpose      : Provides the on-screen form that gathers the data
                 for a student ID card. Every behaviour (field
                 checking, building the Student object, and the
                 cookie read/write) is handled in "StudentApp.js".
=====================================================================
-->
<html lang="en">                                   <!-- Document root, English language -->

<head>                                            <!-- Page metadata and styling -->
    <meta charset="UTF-8">                        <!-- Unicode character support -->
    <!-- Responsive scaling on mobiles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab caption must show the student UID -->
    <title>2025EB01187</title>

    <!-- Styling is kept inline here because the JavaScript file is the graded part -->
    <style>
        * { box-sizing: border-box; }            /* Padding/border counted inside width */

        body {                                    /* Overall page canvas */
            font-family: "Segoe UI", Tahoma, Arial, sans-serif; /* Clean font stack */
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); /* Blue wash */
            margin: 0;                            /* Remove default body margin */
            padding: 30px;                        /* Space around the card */
            display: flex;                        /* Flexbox to centre the card */
            justify-content: center;              /* Horizontal centring */
        }

        .form-card {                              /* White panel that holds the form */
            background: #ffffff;                  /* White surface */
            width: 440px;                         /* Comfortable reading width */
            padding: 28px 32px;                   /* Inner spacing */
            border-radius: 14px;                  /* Rounded corners */
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2); /* Drop shadow for depth */
        }

        h1 {                                      /* Main heading */
            font-size: 22px;                      /* Prominent size */
            color: #1e3c72;                       /* Brand blue */
            margin: 0 0 4px 0;                    /* Tight bottom margin */
            text-align: center;                   /* Centre the title */
        }

        .subtitle {                               /* Grey helper line under the title */
            text-align: center;                   /* Centred */
            font-size: 13px;                      /* Small */
            color: #888;                          /* Muted grey */
            margin-bottom: 22px;                  /* Gap before the first field */
        }

        .field { margin-bottom: 16px; }          /* Vertical rhythm between fields */

        label {                                   /* Caption above each input */
            display: block;                       /* Force onto its own line */
            font-size: 13px;                      /* Small caption */
            font-weight: 600;                     /* Semi-bold */
            color: #333;                          /* Dark grey */
            margin-bottom: 5px;                   /* Gap before the input */
        }

        input, select {                           /* Shared look for text inputs + dropdown */
            width: 100%;                          /* Fill the available width */
            padding: 10px 12px;                   /* Inner spacing */
            font-size: 14px;                      /* Readable text */
            border: 1px solid #ccc;               /* Light grey border */
            border-radius: 7px;                   /* Soft corners */
            outline: none;                        /* Remove default focus ring */
            transition: border-color 0.2s;        /* Smooth colour change on focus */
        }

        input:focus, select:focus { border-color: #2a5298; } /* Blue border while focused */

        /* JavaScript adds .invalid to any field that fails a check */
        input.invalid, select.invalid { border-color: #e74c3c; background: #fdf0ef; }

        .error {                                  /* Inline message beneath a field */
            color: #e74c3c;                       /* Red warning colour */
            font-size: 12px;                      /* Small */
            min-height: 15px;                     /* Reserve space so layout never jumps */
            margin-top: 4px;                      /* Gap above the message */
        }

        button {                                  /* The submit button */
            width: 100%;                          /* Full width */
            padding: 12px;                        /* Tall, easy to click */
            margin-top: 6px;                      /* Gap above the button */
            font-size: 15px;                      /* Readable label */
            font-weight: 600;                     /* Semi-bold */
            color: #fff;                          /* White text */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* Blue gradient */
            border: none;                         /* No default border */
            border-radius: 8px;                   /* Rounded */
            cursor: pointer;                      /* Hand cursor on hover */
        }

        button:hover { opacity: 0.92; }          /* Subtle feedback on hover */

        .result {                                 /* Green success banner (shown by JS) */
            margin-top: 18px;                     /* Space above the banner */
            padding: 14px;                        /* Inner spacing */
            border-radius: 8px;                   /* Rounded */
            background: #eafaf1;                  /* Pale green */
            border: 1px solid #27ae60;            /* Green outline */
            color: #1e7e44;                       /* Dark green text */
            font-size: 13px;                      /* Small */
            display: none;                        /* Hidden until a valid submit */
            white-space: pre-line;                /* Honour the line breaks we insert */
        }
    </style>
</head>

<body>                                            <!-- Visible page content -->

    <div class="form-card">                       <!-- The white application panel -->
        <h1>Student ID Card Application</h1>      <!-- Panel heading -->
        <p class="subtitle">Please fill in all the fields below</p> <!-- Helper text -->

        <!-- novalidate turns off the browser's built-in checks so our JS runs instead -->
        <form id="studentForm" novalidate>

            <!-- Field 1 : Full Name -->
            <div class="field">
                <label for="fullName">Full Name</label>                 <!-- Caption -->
                <input type="text" id="fullName" placeholder="e.g. Amman Jakhar"> <!-- Input -->
                <div class="error" id="err-fullName"></div>             <!-- Error slot -->
            </div>

            <!-- Field 2 : University ID -->
            <div class="field">
                <label for="uid">University ID (UID)</label>
                <input type="text" id="uid" placeholder="e.g. 2025EB01187">
                <div class="error" id="err-uid"></div>
            </div>

            <!-- Field 3 : Email -->
            <div class="field">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="e.g. name@example.com">
                <div class="error" id="err-email"></div>
            </div>

            <!-- Field 4 : Phone -->
            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="10 digit mobile number">
                <div class="error" id="err-phone"></div>
            </div>

            <!-- Field 5 : Date of Birth -->
            <div class="field">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">
                <div class="error" id="err-dob"></div>
            </div>

            <!-- Supporting field : Course (outside the five graded validations) -->
            <div class="field">
                <label for="course">Course</label>
                <select id="course">                                    <!-- Dropdown -->
                    <option value="">-- Select a course --</option>     <!-- Default/empty -->
                    <option value="M.Sc. Computer Science">M.Sc. Computer Science</option>
                    <option value="B.Tech. Mechanical">B.Tech. Mechanical</option>
                    <option value="MBA">MBA</option>
                </select>
                <div class="error" id="err-course"></div>
            </div>

            <button type="submit">Generate ID Card</button>             <!-- Triggers the JS -->
        </form>

        <!-- The script fills this banner in after a successful submission -->
        <div class="result" id="result"></div>
    </div>

    <!-- Load the external JavaScript deliverable -->
    <script src="StudentApp.js"></script>
</body>
</html>
