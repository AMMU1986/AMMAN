<!DOCTYPE html>                                   <!-- tells the browser "treat me as modern HTML5", not quirks mode -->
<!--
#####################################################################
#  QUESTION 1  ::  STUDENT IDENTITY CARD  ::  MARKUP ONLY
#  ---------------------------------------------------------------
#  Written by : AMMAN JAKHAR
#  My UID     : 2025EB01187
#  Born on    : 29.08.1986
#  ---------------------------------------------------------------
#  How I approached this file:
#    * This file is the SKELETON. It names the parts of the card
#      and nothing else - no colours, no widths, no fonts.
#    * All of the "paint" sits in aj-idcard.css, linked below.
#    * I invented my own class names, all starting with "aj-"
#      (my initials) so they are unmistakably mine and never clash
#      with a framework or with anyone else's work.
#    * The three regions (top / middle / bottom) copy how a real
#      laminated campus card is arranged.
#####################################################################
-->
<html lang="en">                                   <!-- "en" = English, which helps screen-reading software -->

<head>                                            <!-- HEAD = behind-the-scenes info the reader never sees -->
    <meta charset="UTF-8">                        <!-- pick Unicode so letters/symbols never break -->
    <!-- the next line is what stops the card looking tiny and zoomed-out on a phone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Q1 explicitly wants my UID on the tab, so the document title literally IS my UID -->
    <title>2025EB01187</title>

    <!-- hook up the single stylesheet; every visual rule lives over there, not in here -->
    <link rel="stylesheet" href="IDCard_styles.css">
</head>

<body>                                            <!-- BODY = the visible part of the page -->

    <!-- ========================================================= -->
    <!-- ONE outer box holds the whole card. Keeping it to a single -->
    <!-- wrapper means the rounded corners + shadow treat the card  -->
    <!-- as one solid object instead of three loose strips.         -->
    <!-- ========================================================= -->
    <div class="aj-idcard">

        <!-- ================= TOP STRIP: the issuer ================= -->
        <!-- <header> is a semantic tag: it announces "intro / banner" -->
        <header class="aj-idcard__head">
            <div class="aj-crest">UoH</div>               <!-- round badge; stands in for a university crest -->
            <div class="aj-org">                          <!-- the two text lines grouped so they sit beside the badge -->
                <h1 class="aj-org__name">University of Higher Studies</h1>  <!-- h1 = the top-level heading of the page -->
                <p class="aj-org__dept">Department of Computer Science</p>  <!-- the smaller, supporting line -->
            </div>
        </header>

        <!-- ================= MIDDLE STRIP: the holder ================= -->
        <!-- <main> carries the real subject matter: the photo + my data -->
        <main class="aj-idcard__body">

            <!-- LEFT: an empty, framed box where a passport photo would go -->
            <div class="aj-photo-col">                    <!-- this wrapper stops flexbox stretching the photo -->
                <div class="aj-photo">                    <!-- the bordered rectangle itself -->
                    <span class="aj-photo__text">PHOTO</span>  <!-- placeholder caption until a real picture is added -->
                </div>
            </div>

            <!-- RIGHT: a list of facts. Each .aj-fact is a tiny caption sitting over its value. -->
            <div class="aj-facts">

                <!-- fact: my name -->
                <div class="aj-fact">
                    <span class="aj-fact__key">Name</span>               <!-- the little grey caption -->
                    <span class="aj-fact__val">AMMAN JAKHAR</span>       <!-- the bold blue answer -->
                </div>

                <!-- fact: my UID (identical to the number on the tab) -->
                <div class="aj-fact">
                    <span class="aj-fact__key">UID</span>
                    <span class="aj-fact__val">2025EB01187</span>
                </div>

                <!-- fact: my date of birth -->
                <div class="aj-fact">
                    <span class="aj-fact__key">Date of Birth</span>
                    <span class="aj-fact__val">29.08.1986</span>
                </div>

                <!-- fact: my course -->
                <div class="aj-fact">
                    <span class="aj-fact__key">Course</span>
                    <span class="aj-fact__val">M.Sc. Computer Science</span>
                </div>

                <!-- fact: blood group (most real campus cards print this for emergencies) -->
                <div class="aj-fact">
                    <span class="aj-fact__key">Blood Group</span>
                    <span class="aj-fact__val">O+</span>
                </div>

                <!-- fact: expiry date, because every card eventually lapses -->
                <div class="aj-fact">
                    <span class="aj-fact__key">Valid Thru</span>
                    <span class="aj-fact__val">08 / 2027</span>
                </div>
            </div>
        </main>

        <!-- ================= BOTTOM STRIP: signature + barcode ================= -->
        <!-- <footer> is the closing band; the CSS pushes its two halves apart -->
        <footer class="aj-idcard__foot">
            <div class="aj-sign">                         <!-- left half: the signature block -->
                <span class="aj-sign__ink">A. Jakhar</span>   <!-- gets a handwriting font in the CSS -->
                <span class="aj-sign__cap">Card Holder</span> <!-- says whose signature that is -->
            </div>
            <div class="aj-code">                         <!-- right half: the barcode block -->
                <span class="aj-code__digits">2025 EB 01187</span>  <!-- the eye-readable number beneath the bars -->
            </div>
        </footer>

    </div>
    <!-- ================= end of the single card wrapper ================= -->

</body>
</html>
