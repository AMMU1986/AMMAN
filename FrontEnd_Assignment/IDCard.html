<!DOCTYPE html>                                  <!-- HTML5 doctype: keeps the browser in standards mode -->
<!--
=====================================================================
  QUESTION 1 - STUDENT IDENTITY CARD (the markup)
  -----------------------------------------------------------------
  Author : AMMAN JAKHAR
  UID    : 2025EB01187
  DOB    : 29.08.1986
  -----------------------------------------------------------------
  My plan for this file:
    - keep ONLY the structure here (no colours, no sizes),
    - push every visual decision into IDCard_styles.css,
    - so that if a teacher asks "where is the layout defined?"
      the answer is always "in the stylesheet, not the markup".
  I picked a header / body / footer split because a real plastic
  ID card is laid out the same way: branding on top, the holder in
  the middle, and the signature + barcode along the bottom edge.
=====================================================================
-->
<html lang="en">                                   <!-- lang="en" helps screen readers pronounce the text -->

<head>                                            <!-- head = information the visitor never sees directly -->
    <meta charset="UTF-8">                        <!-- UTF-8 so accented names / symbols never turn into gibberish -->
    <!-- the viewport line below makes the card behave on a phone instead of looking zoomed-out -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Requirement for Q1: the tab caption has to be my UID, so the title IS the UID -->
    <title>2025EB01187</title>

    <!-- one external stylesheet; all the "paint" lives there, not here -->
    <link rel="stylesheet" href="IDCard_styles.css">
</head>

<body>                                            <!-- body = the part a visitor actually looks at -->

    <!-- =============== the whole card sits in one wrapper =============== -->
    <!-- I use a single .id-card box so the shadow + rounded corners wrap everything as a unit -->
    <div class="id-card">

        <!-- ---------- TOP: who issued the card ---------- -->
        <!-- header is semantic: it tells browsers/readers "this is introductory banner content" -->
        <header class="card-header">
            <div class="logo">UoH</div>           <!-- stand-in for a crest; initials of the university -->
            <div class="university-info">         <!-- the two text lines live together so they align beside the logo -->
                <h1 class="university-name">University of Higher Studies</h1>  <!-- h1 = the single most important heading -->
                <p class="university-sub">Department of Computer Science</p>   <!-- a quieter supporting line -->
            </div>
        </header>

        <!-- ---------- MIDDLE: the actual card holder ---------- -->
        <!-- main is where the real "content" of the card lives: the photo and the data -->
        <main class="card-body">

            <!-- left side: a placeholder box where a passport photo would be glued -->
            <div class="photo-section">           <!-- wrapper exists so the photo never gets stretched by flexbox -->
                <div class="photo">               <!-- the framed rectangle itself -->
                    <span class="photo-text">PHOTO</span>  <!-- just a label until a real image is dropped in -->
                </div>
            </div>

            <!-- right side: one .detail-row per fact, each is a caption stacked over its value -->
            <div class="details-section">

                <!-- row = Name -->
                <div class="detail-row">
                    <span class="label">Name</span>               <!-- the small grey caption -->
                    <span class="value">AMMAN JAKHAR</span>       <!-- the bold blue answer -->
                </div>

                <!-- row = UID (the same number that titles the tab) -->
                <div class="detail-row">
                    <span class="label">UID</span>
                    <span class="value">2025EB01187</span>
                </div>

                <!-- row = Date of Birth -->
                <div class="detail-row">
                    <span class="label">Date of Birth</span>
                    <span class="value">29.08.1986</span>
                </div>

                <!-- row = Course -->
                <div class="detail-row">
                    <span class="label">Course</span>
                    <span class="value">M.Sc. Computer Science</span>
                </div>

                <!-- row = Blood Group (handy on a real campus ID in an emergency) -->
                <div class="detail-row">
                    <span class="label">Blood Group</span>
                    <span class="value">O+</span>
                </div>

                <!-- row = expiry; every card needs a "use-by" date -->
                <div class="detail-row">
                    <span class="label">Valid Thru</span>
                    <span class="value">08 / 2027</span>
                </div>
            </div>
        </main>

        <!-- ---------- BOTTOM: signature on the left, barcode on the right ---------- -->
        <!-- footer is the closing strip; I split it left/right with flexbox in the CSS -->
        <footer class="card-footer">
            <div class="signature">               <!-- two stacked lines: the "ink" and its caption -->
                <span class="sign-line">A. Jakhar</span>    <!-- styled later with a handwriting font -->
                <span class="sign-label">Card Holder</span> <!-- tells the reader whose signature that is -->
            </div>
            <div class="barcode">                 <!-- the bars themselves are drawn in CSS, not an image -->
                <span class="barcode-number">2025 EB 01187</span>  <!-- the human-readable version under the bars -->
            </div>
        </footer>

    </div>
    <!-- =============== end of the card wrapper =============== -->

</body>
</html>
