<!DOCTYPE html>                                  <!-- Declare this document as HTML5 -->
<!--
=====================================================================
  QUESTION 1  |  STUDENT IDENTITY CARD (STRUCTURE)
  -----------------------------------------------------------------
  Student Name : AMMAN JAKHAR
  Student UID  : 2025EB01187
  Date of Birth: 29.08.1986
  -----------------------------------------------------------------
  File         : IDCard.html
  Purpose      : Holds only the HTML skeleton of a university
                 student identity card. Every visual rule is kept
                 separate inside "IDCard_styles.css" so that the
                 markup stays clean and easy to read.
=====================================================================
-->
<html lang="en">                                   <!-- Root element; page language is English -->

<head>                                            <!-- Non-visible metadata for the page -->
    <meta charset="UTF-8">                        <!-- Use Unicode so every character renders -->
    <!-- Make the layout responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The browser tab caption must display the student UID -->
    <title>2025EB01187</title>

    <!-- Pull in the external stylesheet that paints this card -->
    <link rel="stylesheet" href="IDCard_styles.css">
</head>

<body>                                            <!-- Everything the user can see starts here -->

    <!-- ================= OUTER CARD WRAPPER ================= -->
    <div class="id-card">                         <!-- Single container that frames the whole card -->

        <!-- ---------- TOP STRIP : institution branding ---------- -->
        <header class="card-header">              <!-- Coloured banner across the top -->
            <div class="logo">UoH</div>           <!-- Round badge standing in for a crest/logo -->
            <div class="university-info">         <!-- Text block beside the logo -->
                <h1 class="university-name">University of Higher Studies</h1>  <!-- Institution name -->
                <p class="university-sub">Department of Computer Science</p>   <!-- Owning department -->
            </div>
        </header>

        <!-- ---------- MIDDLE STRIP : photo + personal data ---------- -->
        <main class="card-body">                  <!-- Main informative region of the card -->

            <!-- Left column : a placeholder for the student photograph -->
            <div class="photo-section">           <!-- Keeps the photo box from stretching -->
                <div class="photo">               <!-- Framed square that would hold a real photo -->
                    <span class="photo-text">PHOTO</span>  <!-- Caption shown inside the box -->
                </div>
            </div>

            <!-- Right column : label/value pairs describing the holder -->
            <div class="details-section">         <!-- Stacks all the detail rows vertically -->

                <div class="detail-row">          <!-- One field : Name -->
                    <span class="label">Name</span>               <!-- Field caption -->
                    <span class="value">AMMAN JAKHAR</span>       <!-- Field value -->
                </div>

                <div class="detail-row">          <!-- One field : UID -->
                    <span class="label">UID</span>
                    <span class="value">2025EB01187</span>
                </div>

                <div class="detail-row">          <!-- One field : Date of Birth -->
                    <span class="label">Date of Birth</span>
                    <span class="value">29.08.1986</span>
                </div>

                <div class="detail-row">          <!-- One field : Course -->
                    <span class="label">Course</span>
                    <span class="value">M.Sc. Computer Science</span>
                </div>

                <div class="detail-row">          <!-- One field : Blood Group -->
                    <span class="label">Blood Group</span>
                    <span class="value">O+</span>
                </div>

                <div class="detail-row">          <!-- One field : expiry date -->
                    <span class="label">Valid Thru</span>
                    <span class="value">08 / 2027</span>
                </div>
            </div>
        </main>

        <!-- ---------- BOTTOM STRIP : signature + barcode ---------- -->
        <footer class="card-footer">              <!-- Closing band at the foot of the card -->
            <div class="signature">               <!-- Signature cluster on the left -->
                <span class="sign-line">A. Jakhar</span>    <!-- Handwritten-style signature -->
                <span class="sign-label">Card Holder</span> <!-- Caption under the signature -->
            </div>
            <div class="barcode">                 <!-- Decorative barcode cluster on the right -->
                <span class="barcode-number">2025 EB 01187</span>  <!-- Human-readable code -->
            </div>
        </footer>

    </div>
    <!-- ================= END CARD WRAPPER ================= -->

</body>
</html>
