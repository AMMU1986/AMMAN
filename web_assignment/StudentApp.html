<!DOCTYPE html>
<!--
====================================================================
  Student ID Card Application Form  -  Question 2
  --------------------------------------------------------------
  Student Name : AMMAN JAKHAR
  Student UID  : 2025EB01187
  Date of Birth: 29.08.1986
  --------------------------------------------------------------
  File         : StudentApp.html
  Description  : HTML form used to collect data for a Student ID
                 Card. All validation, object creation and cookie
                 handling logic lives in "StudentApp.js".
====================================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The page title is set to the Student ID as required -->
    <title>2025EB01187</title>

    <!-- Inline styling kept small; main deliverable is the JS file -->
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .form-card {
            background: #ffffff;
            width: 440px;
            padding: 28px 32px;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 22px;
            color: #1e3c72;
            margin: 0 0 4px 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 22px;
        }

        .field { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus { border-color: #2a5298; }

        /* Red border applied by JS when a field is invalid */
        input.invalid, select.invalid { border-color: #e74c3c; background: #fdf0ef; }

        /* Inline error message under each field */
        .error {
            color: #e74c3c;
            font-size: 12px;
            min-height: 15px;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover { opacity: 0.92; }

        /* Success banner shown after a valid submission */
        .result {
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            background: #eafaf1;
            border: 1px solid #27ae60;
            color: #1e7e44;
            font-size: 13px;
            display: none;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <div class="form-card">
        <h1>Student ID Card Application</h1>
        <p class="subtitle">Please fill in all the fields below</p>

        <!-- The form is handled entirely in StudentApp.js (no page reload) -->
        <form id="studentForm" novalidate>

            <!-- Field 1 : Full Name -->
            <div class="field">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="e.g. Amman Jakhar">
                <div class="error" id="err-fullName"></div>
            </div>

            <!-- Field 2 : University ID -->
            <div class="field">
                <label for="uid">University ID (UID)</label>
                <input type="text" id="uid" placeholder="e.g. 2025EB01187">
                <div class="error" id="err-uid"></div>
            </div>

            <!-- Field 3 : Email -->
            <div class="field">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="e.g. name@example.com">
                <div class="error" id="err-email"></div>
            </div>

            <!-- Field 4 : Phone -->
            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="10 digit mobile number">
                <div class="error" id="err-phone"></div>
            </div>

            <!-- Field 5 : Date of Birth -->
            <div class="field">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">
                <div class="error" id="err-dob"></div>
            </div>

            <!-- Extra field : Course (not counted in the 5 validations) -->
            <div class="field">
                <label for="course">Course</label>
                <select id="course">
                    <option value="">-- Select a course --</option>
                    <option value="M.Sc. Computer Science">M.Sc. Computer Science</option>
                    <option value="B.Tech. Mechanical">B.Tech. Mechanical</option>
                    <option value="MBA">MBA</option>
                </select>
                <div class="error" id="err-course"></div>
            </div>

            <button type="submit">Generate ID Card</button>
        </form>

        <!-- Success message / summary populated by JS -->
        <div class="result" id="result"></div>
    </div>

    <!-- Link to the external JavaScript deliverable -->
    <script src="StudentApp.js"></script>
</body>
</html>
