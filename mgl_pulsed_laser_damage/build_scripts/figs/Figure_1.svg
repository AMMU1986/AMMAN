<text x="180" y="52" font-size="14" fill="#c0392b">pulse train I<tspan baseline-shift="-25%" font-size="75%">0</tspan>f(t)</text>
<text x="84" y="232" font-size="13" >σ<tspan baseline-shift="-25%" font-size="75%">xx</tspan>=0, adiabatic at x = 0;  u = 0, θ = 0 at x = L;  continuity of u, σ, θ and flux at x = h</text>
<text x="450" y="268" font-size="15" font-weight="bold" text-anchor="middle">(b) Decision variables: pulse train f(t) = Σ [H(t − mP) − H(t − mP − t<tspan baseline-shift="-25%" font-size="75%">p</tspan>)], m = 0 … N<tspan baseline-shift="-25%" font-size="75%">p</tspan>−1</text>
