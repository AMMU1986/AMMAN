<text x="446" y="482" font-size="14" text-anchor="middle" font-weight="bold">damage</text>
<text x="446" y="504" font-size="11" text-anchor="middle">Ω = ∫ A e<tspan baseline-shift="40%" font-size="75%">−E_{a</tspan>/RT} dt</text>
<line x1="516" y1="488" x2="544" y2="488" stroke="#222" marker-end="url(#ar)"/>
<rect x="544" y="456" width="140" height="64" rx="6" fill="#f3f3f3" stroke="#444"/>
<text x="614" y="482" font-size="14" text-anchor="middle" font-weight="bold">stress</text>
<text x="614" y="504" font-size="11" text-anchor="middle">σ<tspan baseline-shift="-25%" font-size="75%">∥</tspan> = −s(θ + τ<tspan baseline-shift="-25%" font-size="75%">1</tspan>θ<tspan baseline-shift="-25%" font-size="75%">t</tspan>)</text>
<line x1="684" y1="488" x2="712" y2="488" stroke="#222" marker-end="url(#ar)"/>
<rect x="712" y="456" width="140" height="64" rx="6" fill="#f3f3f3" stroke="#444"/>
<text x="782" y="482" font-size="14" text-anchor="middle" font-weight="bold">Nelder–Mead</text>
<text x="782" y="504" font-size="11" text-anchor="middle">min J + penalties</text>
<path d="M 784 520 L 784 544 L 110 544 L 110 522" fill="none" stroke="#222" marker-end="url(#ar)"/>
<text x="450" y="562" font-size="12" text-anchor="middle">update d until constraints (kill, T<tspan baseline-shift="-25%" font-size="75%">max</tspan>, |σ|, t<tspan baseline-shift="-25%" font-size="75%">treat</tspan>) hold and J stops decreasing</text>
<text x="450" y="596" font-size="13" text-anchor="middle" font-style="italic">Schematic only: contains no computed data.</text></svg>