<polyline points="99,340 100,340 100,296 170,296 170,340" fill="none" stroke="#1f4e9c" stroke-width="2.5"/>
<polyline points="249,340 250,340 250,296 320,296 320,340" fill="none" stroke="#1f4e9c" stroke-width="2.5"/>
<polyline points="399,340 400,340 400,296 470,296 470,340" fill="none" stroke="#1f4e9c" stroke-width="2.5"/>
<polyline points="549,340 550,340 550,296 620,296 620,340" fill="none" stroke="#1f4e9c" stroke-width="2.5"/>
<line x1="100" y1="360" x2="170" y2="360" stroke="#222" marker-end="url(#ar)"/>
