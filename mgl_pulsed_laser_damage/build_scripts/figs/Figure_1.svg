<svg xmlns="http://www.w3.org/2000/svg" width="900" height="616" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<text x="450" y="22" font-size="15" font-weight="bold" text-anchor="middle">(a) Layered slab, 1-D: tumour 0 &lt; x &lt; h, normal tissue h &lt; x &lt; L</text>
