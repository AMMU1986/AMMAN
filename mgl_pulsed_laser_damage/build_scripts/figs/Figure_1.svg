<text x="278" y="482" font-size="14" text-anchor="middle" font-weight="bold">heat model</text>
<text x="278" y="504" font-size="11" text-anchor="middle">θ(x,t): FE + BDF2</text>
<line x1="348" y1="488" x2="376" y2="488" stroke="#222" marker-end="url(#ar)"/>
