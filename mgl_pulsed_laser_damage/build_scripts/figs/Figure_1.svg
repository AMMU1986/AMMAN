<text x="175" y="406" font-size="14" text-anchor="middle">period P</text>
<text x="60" y="300" font-size="14" text-anchor="end">I<tspan baseline-shift="-25%" font-size="75%">0</tspan></text>
<text x="700" y="322" font-size="14" >N<tspan baseline-shift="-25%" font-size="75%">p</tspan> pulses, t<tspan baseline-shift="-25%" font-size="75%">treat</tspan> = N<tspan baseline-shift="-25%" font-size="75%">p</tspan>P ≤ 30 s</text>
<text x="450" y="436" font-size="15" font-weight="bold" text-anchor="middle">(c) Design workflow</text>
<rect x="40" y="456" width="140" height="64" rx="6" fill="#f3f3f3" stroke="#444"/>
<text x="110" y="482" font-size="14" text-anchor="middle" font-weight="bold">design d</text>
<text x="110" y="504" font-size="11" text-anchor="middle">I<tspan baseline-shift="-25%" font-size="75%">0</tspan>, t<tspan baseline-shift="-25%" font-size="75%">p</tspan>, P, N<tspan baseline-shift="-25%" font-size="75%">p</tspan></text>
<line x1="180" y1="488" x2="208" y2="488" stroke="#222" marker-end="url(#ar)"/>
