<line x1="200" y1="310" x2="300" y2="310" stroke="#c00000" stroke-width="3" marker-end="url(#a)"/>
<rect x="310" y="110" width="330" height="240" fill="url(#hg)" stroke="#000" stroke-width="1.5"/>
<text x="475" y="100" font-size="15" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">metal film (Au, Cu), thickness L</text>
<text x="318" y="370" font-size="14" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">x = 0</text>
<text x="600" y="370" font-size="14" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">x = L</text>
<text x="322" y="135" font-size="13" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Q = Q₀ exp(−x/δ) g(t)</text>
<text x="322" y="155" font-size="13" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">δ = 12.6–15.3 nm</text>
<line x1="360" y1="230" x2="470" y2="230" stroke="#1f4e79" stroke-width="2.5" marker-end="url(#a)"/>
<text x="380" y="220" font-size="13" fill="#1f4e79" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">stress wave, speed c_L</text>
<line x1="360" y1="290" x2="430" y2="290" stroke="#2e8b57" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#a)"/>
<text x="370" y="310" font-size="13" fill="#2e8b57" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">heat (single-delay law)</text>
<rect x="640" y="110" width="40" height="240" fill="#d9d9d9" stroke="#000" stroke-dasharray="5,3"/>
<text x="690" y="200" font-size="13" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(a) free-standing:</text>
<text x="690" y="218" font-size="13" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">σ = 0 at x = L</text>
<text x="690" y="250" font-size="13" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">(b) rigid substrate:</text>
<text x="690" y="268" font-size="13" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">u = 0 at x = L</text>
<text x="690" y="300" font-size="13" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">both faces adiabatic</text>
<text x="40" y="420" font-size="14" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Single-delay law: q,t = −k*θ,x − (k + τ₀k*)θ,xt − (τ₀²/2)k*θ,xtt ;  motion: ρu,tt = M u,xx − βθ,x</text>
<text x="40" y="445" font-size="14" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Solution: Laplace transform in t, closed form in x, Durbin numerical inversion</text></svg>