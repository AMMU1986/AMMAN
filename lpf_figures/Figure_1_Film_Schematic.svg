<text x="60" y="230" font-size="14" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Gaussian pulse g(t)</text>
<text x="60" y="250" font-size="14" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">tₚ = 100 fs</text>
<line x1="200" y1="150" x2="300" y2="150" stroke="#c00000" stroke-width="3" marker-end="url(#a)"/>
<line x1="200" y1="190" x2="300" y2="190" stroke="#c00000" stroke-width="3" marker-end="url(#a)"/>
