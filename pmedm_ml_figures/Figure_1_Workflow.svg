<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect x="0" y="0" width="1000" height="640" fill="white"/><rect x="30.00" y="20.00" width="440.00" height="92.00" rx="8.0" stroke="#1f4e79" fill="#eef3fa" stroke-width="1.40" fill-opacity="1.00"/><text x="250.00" y="42.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14.0" text-anchor="middle" fill="#1f4e79" font-weight="700">1  Published data (anchor study)</text><text x="250.00" y="64.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">L27 runs: t_off, t_on, current, powder; responses MRR, TWR</text><text x="250.00" y="82.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">+ 3 confirmation replicates at A2B3C1D3</text><rect x="530.00" y="20.00" width="440.00" height="92.00" rx="8.0" stroke="#c55a11" fill="#fbeee6" stroke-width="1.40" fill-opacity="1.00"/><text x="750.00" y="42.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14.0" text-anchor="middle" fill="#c55a11" font-weight="700">2  Consistency audit</text><text x="750.00" y="64.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">GRA recomputed from raw MRR/TWR</text><text x="750.00" y="82.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">ANOVA, regression R², alias structure</text><rect x="30.00" y="150.00" width="940.00" height="72.00" rx="8.0" stroke="#1f4e79" fill="#eef3fa" stroke-width="1.40" fill-opacity="1.00"/><text x="500.00" y="172.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14.0" text-anchor="middle" fill="#1f4e79" font-weight="700">3  Leakage-free representation and validation</text><text x="500.00" y="194.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">ln(y) targets · design-bound scaling · powder as a categorical factor · every fit, scaling and hyperparameter step inside the fold · LOO + 10 × 5-fold CV</text><rect x="30.00" y="262.00" width="940.00" height="92.00" rx="8.0" stroke="#548235" fill="#eef7ee" stroke-width="1.40" fill-opacity="1.00"/><text x="500.00" y="284.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14.0" text-anchor="middle" fill="#548235" font-weight="700">4  Surrogate models (12)</text><text x="500.00" y="306.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">Null mean · Taguchi main effects · physics-guided power law · quadratic RSM</text><text x="500.00" y="324.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">GPR (Matérn-5/2 × powder kernel; also with replicate-error noise) · random forest · XGBoost-type GBT</text><text x="500.00" y="342.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal"></text><text x="500.00" y="343.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">ANFIS (2 and 3 MF per input) · MC-dropout MLP · deep ensemble</text><rect x="30.00" y="394.00" width="300.00" height="112.00" rx="8.0" stroke="#7030a0" fill="#f4eefa" stroke-width="1.40" fill-opacity="1.00"/><text x="180.00" y="416.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14.0" text-anchor="middle" fill="#7030a0" font-weight="700">5a  Uncertainty</text><text x="180.00" y="438.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">GP and OLS predictive intervals</text><text x="180.00" y="456.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">MC dropout · deep ensemble</text><text x="180.00" y="474.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">jackknife+ conformal</text><text x="180.00" y="492.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">coverage, NLL, calibration</text><rect x="350.00" y="394.00" width="300.00" height="112.00" rx="8.0" stroke="#7030a0" fill="#f4eefa" stroke-width="1.40" fill-opacity="1.00"/><text x="500.00" y="416.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14.0" text-anchor="middle" fill="#7030a0" font-weight="700">5b  Explanation</text><text x="500.00" y="438.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">exact interventional SHAP</text><text x="500.00" y="456.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">partial dependence</text><text x="500.00" y="474.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">versus main-effects ANOVA</text><text x="500.00" y="492.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">permutation tests of Q²</text><rect x="670.00" y="394.00" width="300.00" height="112.00" rx="8.0" stroke="#7030a0" fill="#f4eefa" stroke-width="1.40" fill-opacity="1.00"/><text x="820.00" y="416.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14.0" text-anchor="middle" fill="#7030a0" font-weight="700">5c  Decision</text><text x="820.00" y="438.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">NSGA-II fronts: nominal and risk-aware</text><text x="820.00" y="456.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">TOPSIS (entropy, CRITIC weights)</text><text x="820.00" y="474.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">P(Pareto-optimal) over 81 settings</text><text x="820.00" y="492.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">MC-EHVI Bayesian optimization</text><rect x="180.00" y="546.00" width="640.00" height="74.00" rx="8.0" stroke="#bf9000" fill="#fff7e0" stroke-width="1.40" fill-opacity="1.00"/><text x="500.00" y="568.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14.0" text-anchor="middle" fill="#bf9000" font-weight="700">6  Outputs</text><text x="500.00" y="590.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">Out-of-sample test of the published optimum A2B3C1D3</text><text x="500.00" y="608.00" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="middle" fill="#222" font-weight="normal">and a ranked batch of next experiments</text><line x1="250.00" y1="112.00" x2="250.00" y2="150.00" stroke="#555" stroke-width="1.60"/><polygon points="250.0,150.0 246.5,141.7 253.5,141.7" fill="#555"/><line x1="470.00" y1="66.00" x2="530.00" y2="66.00" stroke="#555" stroke-width="1.60"/><polygon points="530.0,66.0 521.7,69.5 521.7,62.5" fill="#555"/><line x1="500.00" y1="222.00" x2="500.00" y2="262.00" stroke="#555" stroke-width="1.60"/><polygon points="500.0,262.0 496.5,253.7 503.5,253.7" fill="#555"/><line x1="180.00" y1="354.00" x2="180.00" y2="394.00" stroke="#555" stroke-width="1.60"/><polygon points="180.0,394.0 176.5,385.7 183.5,385.7" fill="#555"/><line x1="500.00" y