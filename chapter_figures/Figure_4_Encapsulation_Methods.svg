<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Figure 4: PCM Encapsulation Methods – Macro, Micro, and Shape-Stabilized</text>

  <!-- MACROENCAPSULATION -->
  <rect x="20" y="50" width="240" height="320" rx="8" fill="#F8F9FA" stroke="#2980B9" stroke-width="2"/>
  <text x="140" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980B9">Macroencapsulation</text>
  <text x="140" y="92" text-anchor="middle" font-size="10" fill="#666">(1 mm – 10 cm)</text>

  <!-- Tube shape -->
  <rect x="50" y="110" width="80" height="50" rx="25" fill="#AED6F1" stroke="#2980B9" stroke-width="2"/>
  <text x="90" y="140" text-anchor="middle" font-size="10" fill="#1F618D">Tube</text>

  <!-- Panel shape -->
  <rect x="145" y="115" width="90" height="40" rx="4" fill="#AED6F1" stroke="#2980B9" stroke-width="2"/>
  <text x="190" y="140" text-anchor="middle" font-size="10" fill="#1F618D">Panel</text>

  <!-- Sphere shape -->
  <circle cx="90" cy="200" r="25" fill="#AED6F1" stroke="#2980B9" stroke-width="2"/>
  <text x="90" y="204" text-anchor="middle" font-size="10" fill="#1F618D">Sphere</text>

  <!-- Properties -->
  <text x="40" y="255" font-size="10" fill="#333">• Easy to handle</text>
  <text x="40" y="272" font-size="10" fill="#333">• Compatible with existing</text>
  <text x="40" y="287" font-size="10" fill="#333">  manufacturing</text>
  <text x="40" y="304" font-size="10" fill="#333">• Accommodates volume</text>
  <text x="40" y="319" font-size="10" fill="#333">  change</text>
  <text x="40" y="340" font-size="10" fill="#C0392B">• Low surface/volume ratio</text>
  <text x="40" y="357" font-size="10" fill="#C0392B">• Limited heat transfer</text>

  <!-- MICROENCAPSULATION -->
  <rect x="280" y="50" width="240" height="320" rx="8" fill="#F8F9FA" stroke="#27AE60" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#27AE60">Micro/Nano-encapsulation</text>
  <text x="400" y="92" text-anchor="middle" font-size="10" fill="#666">(1 μm – 1000 μm)</text>

  <!-- Microcapsules illustration -->
  <circle cx="340" cy="135" r="18" fill="#A9DFBF" stroke="#27AE60" stroke-width="2"/>
  <circle cx="340" cy="135" r="12" fill="#D5F5E3"/>
  <text x="340" y="139" text-anchor="middle" font-size="8" fill="#1E8449">PCM</text>

  <circle cx="390" cy="145" r="14" fill="#A9DFBF" stroke="#27AE60" stroke-width="2"/>
  <circle cx="390" cy="145" r="9" fill="#D5F5E3"/>

  <circle cx="430" cy="130" r="16" fill="#A9DFBF" stroke="#27AE60" stroke-width="2"/>
  <circle cx="430" cy="130" r="10" fill="#D5F5E3"/>

  <circle cx="460" cy="150" r="12" fill="#A9DFBF" stroke="#27AE60" stroke-width="2"/>
  <circle cx="460" cy="150" r="7" fill="#D5F5E3"/>

  <circle cx="370" cy="170" r="10" fill="#A9DFBF" stroke="#27AE60" stroke-width="1.5"/>
  <circle cx="370" cy="170" r="6" fill="#D5F5E3"/>

  <!-- Shell label -->
  <line x1="358" y1="120" x2="380" y2="105" stroke="#555" stroke-width="1"/>
  <text x="383" y="105" font-size="9" fill="#555">Shell</text>

  <line x1="340" y1="135" x2="310" y2="115" stroke="#555" stroke-width="1"/>
  <text x="295" y="112" font-size="9" fill="#555">Core (PCM)</text>

  <!-- Properties -->
  <text x="300" y="210" font-size="10" fill="#333">• High surface/volume ratio</text>
  <text x="300" y="227" font-size="10" fill="#333">• Excellent heat transfer</text>
  <text x="300" y="244" font-size="10" fill="#333">• Prevents leakage</text>
  <text x="300" y="261" font-size="10" fill="#333">• Can be mixed into</text>
  <text x="300" y="276" font-size="10" fill="#333">  building materials</text>
  <text x="300" y="296" font-size="10" fill="#333">• Prevents phase separation</text>
  <text x="300" y="320" font-size="10" fill="#C0392B">• Shell reduces capacity</text>
  <text x="300" y="337" font-size="10" fill="#C0392B">• Higher cost</text>
  <text x="300" y="354" font-size="10" fill="#C0392B">• Shell may rupture</text>

  <!-- SHAPE STABILIZATION -->
  <rect x="540" y="50" width="240" height="320" rx="8" fill="#F8F9FA" stroke="#8E44AD" stroke-width="2"/>
  <text x="660" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#8E44AD">Shape-Stabilized</text>
  <text x="660" y="92" text-anchor="middle" font-size="10" fill="#666">(PCM in porous matrix)</text>

  <!-- Matrix illustration -->
  <rect x="590" y="110" width="140" height="80" rx="4" fill="#E8DAEF" stroke="#8E44AD" stroke-width="2"/>
  <!-- Pores with PCM -->
  <circle cx="620" cy="135" r="8" fill="#D2B4DE"/>
  <circle cx="645" cy="125" r="6" fill="#D2B4DE"/>
  <circle cx="670" cy="140" r="9" fill="#D2B4DE"/>
  <circle cx="700" cy="130" r="7" fill="#D2B4DE"/>
  <circle cx="615" cy="160" r="7" fill="#D2B4DE"/>
  <circle cx="640" cy="165" r="5" fill="#D2B4DE"/>
  <circle cx="665" cy="170" r="8" fill="#D2B4DE"/>
  <circle cx="695" cy="160" r="6" fill="#D2B4DE"/>
  <circle cx="710" cy="150" r="5" fill="#D2B4DE"/>

  <!-- Labels -->
  <text x="660" y="148" text-anchor="middle" font-size="8" fill="#4A235A">PCM in pores</text>

  <line x1="730" y1="115" x2="750" y2="105" stroke="#555" stroke-width="1"/>
  <text x="728" y="103" font-size="9" fill="#555">Matrix</text>

  <!-- Properties -->
  <text x="560" y="215" font-size="10" fill="#333">• No separate container</text>
  <text x="560" y="232" font-size="10" fill="#333">• Capillary forces hold PCM</text>
  <text x="560" y="249" font-size="10" fill="#333">• Can enhance conductivity</text>
  <text x="560" y="266" font-size="10" fill="#333">• Maintains solid shape</text>
  <text x="560" y="283" font-size="10" fill="#333">• Direct structural</text>
  <text x="560" y="298" font-size="10" fill="#333">  integration possible</text>
  <text x="560" y="322" font-size="10" fill="#C0392B">• Matrix occupies volume</text>
  <text x="560" y="339" font-size="10" fill="#C0392B">• 50–85% PCM loading</text>
  <text x="560" y="356" font-size="10" fill="#C0392B">• Limited to porous hosts</text>
</svg>
