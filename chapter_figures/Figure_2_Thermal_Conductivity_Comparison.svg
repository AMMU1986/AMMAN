<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Figure 2: Thermal Conductivity Enhancement of PCMs – Comparison of Techniques</text>

  <!-- Y-axis -->
  <line x1="100" y1="60" x2="100" y2="380" stroke="#333" stroke-width="2"/>
  <text x="40" y="220" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90, 40, 220)">Thermal Conductivity (W/m·K)</text>

  <!-- Y-axis labels and grid -->
  <text x="90" y="380" text-anchor="end" font-size="10" fill="#555">0.1</text>
  <line x1="100" y1="376" x2="700" y2="376" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="90" y="340" text-anchor="end" font-size="10" fill="#555">0.5</text>
  <line x1="100" y1="336" x2="700" y2="336" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="90" y="300" text-anchor="end" font-size="10" fill="#555">1.0</text>
  <line x1="100" y1="296" x2="700" y2="296" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="90" y="240" text-anchor="end" font-size="10" fill="#555">5.0</text>
  <line x1="100" y1="236" x2="700" y2="236" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="90" y="180" text-anchor="end" font-size="10" fill="#555">10</text>
  <line x1="100" y1="176" x2="700" y2="176" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="90" y="120" text-anchor="end" font-size="10" fill="#555">25</text>
  <line x1="100" y1="116" x2="700" y2="116" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="90" y="75" text-anchor="end" font-size="10" fill="#555">50</text>
  <line x1="100" y1="71" x2="700" y2="71" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- X-axis -->
  <line x1="100" y1="380" x2="700" y2="380" stroke="#333" stroke-width="2"/>

  <!-- Bar 1: Pure Paraffin (0.2 W/mK) -->
  <rect x="130" y="368" width="70" height="8" fill="#E74C3C" rx="2"/>
  <text x="165" y="365" text-anchor="middle" font-size="10" fill="#E74C3C" font-weight="bold">0.2</text>
  <text x="165" y="400" text-anchor="middle" font-size="10" fill="#333">Pure</text>
  <text x="165" y="412" text-anchor="middle" font-size="10" fill="#333">Paraffin</text>

  <!-- Bar 2: Salt Hydrate (0.6 W/mK) -->
  <rect x="225" y="354" width="70" height="22" fill="#F39C12" rx="2"/>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#F39C12" font-weight="bold">0.6</text>
  <text x="260" y="400" text-anchor="middle" font-size="10" fill="#333">Salt</text>
  <text x="260" y="412" text-anchor="middle" font-size="10" fill="#333">Hydrate</text>

  <!-- Bar 3: Nanoparticle Enhanced (0.5 W/mK) -->
  <rect x="320" y="340" width="70" height="36" fill="#9B59B6" rx="2"/>
  <text x="355" y="336" text-anchor="middle" font-size="10" fill="#9B59B6" font-weight="bold">0.4</text>
  <text x="355" y="400" text-anchor="middle" font-size="10" fill="#333">Nano-</text>
  <text x="355" y="412" text-anchor="middle" font-size="10" fill="#333">enhanced</text>

  <!-- Bar 4: Metal Foam Composite (8 W/mK) -->
  <rect x="415" y="192" width="70" height="184" fill="#2980B9" rx="2"/>
  <text x="450" y="185" text-anchor="middle" font-size="10" fill="#2980B9" font-weight="bold">8.0</text>
  <text x="450" y="400" text-anchor="middle" font-size="10" fill="#333">Metal</text>
  <text x="450" y="412" text-anchor="middle" font-size="10" fill="#333">Foam</text>

  <!-- Bar 5: Expanded Graphite (15 W/mK) -->
  <rect x="510" y="158" width="70" height="218" fill="#27AE60" rx="2"/>
  <text x="545" y="151" text-anchor="middle" font-size="10" fill="#27AE60" font-weight="bold">15</text>
  <text x="545" y="400" text-anchor="middle" font-size="10" fill="#333">Expanded</text>
  <text x="545" y="412" text-anchor="middle" font-size="10" fill="#333">Graphite</text>

  <!-- Bar 6: Graphene/CNT Composite (25 W/mK) -->
  <rect x="605" y="116" width="70" height="260" fill="#1ABC9C" rx="2"/>
  <text x="640" y="109" text-anchor="middle" font-size="10" fill="#1ABC9C" font-weight="bold">25</text>
  <text x="640" y="400" text-anchor="middle" font-size="10" fill="#333">Graphene/</text>
  <text x="640" y="412" text-anchor="middle" font-size="10" fill="#333">CNT</text>

  <!-- Enhancement factor annotation -->
  <text x="165" y="435" text-anchor="middle" font-size="9" fill="#888">1×</text>
  <text x="260" y="435" text-anchor="middle" font-size="9" fill="#888">3×</text>
  <text x="355" y="435" text-anchor="middle" font-size="9" fill="#888">2×</text>
  <text x="450" y="435" text-anchor="middle" font-size="9" fill="#888">40×</text>
  <text x="545" y="435" text-anchor="middle" font-size="9" fill="#888">75×</text>
  <text x="640" y="435" text-anchor="middle" font-size="9" fill="#888">125×</text>
  <text x="400" y="448" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Enhancement factor relative to pure paraffin</text>

  <!-- Note: Log scale indication -->
  <text x="60" y="52" font-size="9" fill="#888">(Log scale)</text>
</svg>
